name: Release
on:
  push:
    tags: [ "v*" ]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit
  publish-release:
    # Publishes the official GitHub Release when a version tag (vX.Y.Z) is
    # pushed: verifies the tag matches pyproject.toml's version (catches a
    # forgotten version bump before it ships), builds the zip via the
    # default `build_extension.py` (no --version override - the manifest's
    # own version should already equal the tag), and publishes with release
    # notes pulled straight from CHANGELOG.md's matching dated section.
    # Auto-published (not a draft) since the changelog is already
    # maintainer-written by the time a release is tagged.
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: 'pip'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install packaging
      - name: Verify tag matches pyproject.toml version
        run: |
          set -e
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "Tag $GITHUB_REF_NAME (version $tag_version) doesn't match pyproject.toml's version ($pyproject_version)" >&2
            exit 1
          fi
      - name: Build extension zip
        run: python scripts/build_extension.py
      - name: Build release notes from CHANGELOG.md
        # The install note names the built zip explicitly: GitHub attaches its
        # own auto-generated "Source code" archives to every release, and those
        # are not installable in Blender.
        run: |
          set -e
          {
            echo "## Install"
            echo
            echo "Download \`albam-${GITHUB_REF_NAME#v}.zip\` from the assets below,"
            echo "then in Blender: Edit > Preferences > Add-ons > Install from Disk."
            echo "The \"Source code\" archives are generated automatically by GitHub and"
            echo "cannot be installed as an extension."
            echo
          } > release_notes.md
          python scripts/extract_changelog_section.py "${GITHUB_REF_NAME#v}" >> release_notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/albam-*.zip \
            --title "Albam $GITHUB_REF_NAME" \
            --notes-file release_notes.md
