name: Test
on:
  push:
    # Every branch except main: a branch used to get no CI at all until a PR
    # was opened for it, and a PR from a branch in this repo is covered by
    # that same push run. main and v* tags run this through main.yml and
    # release.yml instead, so their publish jobs sit in workflows that only
    # trigger when they will actually run - a job skipped by its own `if:`
    # still shows up on every PR as a skipped check.
    #
    # No pull_request trigger: it only added coverage for PRs from forks,
    # and fork runs get none of the R2 secrets, so the game-file tests skip
    # there anyway. Run a fork's PR by pushing its branch here.
    branches-ignore: [ "main" ]
  # Re-run on demand without pushing anything, e.g. to retry a flaky job:
  # `gh workflow run tests.yml --ref <branch>`. Only offered once this file
  # is on the default branch - GitHub reads the trigger list from there.
  workflow_dispatch:
  # main.yml and release.yml gate their publish jobs on this.
  workflow_call:

# A burst of pushes to one branch used to leave every intermediate commit
# running both matrix legs to completion; only the newest is worth the
# runner. main and tags are excluded: a cancelled run there would skip its
# publish job. The group is not keyed on github.workflow: when called, that
# is the caller's name, and sharing a group with the caller deadlocks it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only the 3.13 leg measures coverage: the 4.2 leg contributed 2
        # covered lines in albam/, and the sys.monitoring core that makes it
        # cheap (pyproject.toml) needs Python 3.12+.
        bpy: [{"bpy-version": "4.2.0", "python-version": "3.11", "coverage": false},
              {"bpy-version": "5.2.0", "python-version": "3.13", "coverage": true}
             ]
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.bpy.python-version }} with bpy ${{ matrix.bpy-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.bpy.python-version }}
        # No `cache: pip` - uv caches instead, below. setup-python's pip cache
        # was keyed on a glob that matched nothing (this repo has no
        # requirements.txt), so the key never changed and the cache only ever
        # grew: 946MB for 3.11 against 461MB for 3.13, same dependencies.
    - name: Set up uv
      # v7 is the newest floating major tag astral-sh publishes; later
      # majors exist but only as exact versions, with no tag to track.
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        # Both files pin what gets installed - pyproject.toml for these jobs,
        # pylock.toml for the extension build - so either changing has to
        # start a fresh cache.
        cache-dependency-glob: |
          pyproject.toml
          pylock.toml
    - name: Install dependencies
      # uv rather than pip for the install: it keeps its cache unpacked and
      # hardlinks into the environment instead of extracting, which matters
      # here because bpy is a 400MB wheel. Measured locally against a warm
      # cache: 25s with pip, 2s with uv.
      run: |
        uv venv --python "${{ matrix.bpy.python-version }}" .venv
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        uv pip install --python .venv/bin/python \
          "bpy==${{ matrix.bpy.bpy-version }}" --extra-index-url https://download.blender.org/pypi/ \
          ".[tests,s3,reen]"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --show-source --statistics
    - name: Test with pytest
      env:
        # Credentials + bucket for --game-dir=<app>::r2://<bucket>/<prefix>
        # below (see .env.example). Passed via env, not interpolated
        # directly into the run: script text - a newline in the secret's
        # value would otherwise become a literal newline in the script,
        # breaking the step (confirmed via a real CI failure). Resolve to
        # empty strings until these secrets exist, which just skips
        # cleanly.
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        # Via PYTEST_ADDOPTS rather than the command line below, which
        # changes shape between branches. Uploaded whatever the outcome:
        # a failing run is when the report is worth most.
        PYTEST_ADDOPTS: --junitxml=junit-${{ matrix.bpy.bpy-version }}.xml
      run: |
        set +e
          R2_BUCKET_NAME="${R2_BUCKET_NAME//$'\n'/}"
          export ALBAM_PYTEST_EXIT_STATUS_FILE="$RUNNER_TEMP/pytest-exit-status"
          rm -f "$ALBAM_PYTEST_EXIT_STATUS_FILE"
          # One worker per runner vCPU. --dist loadfile keeps a file's
          # tests in one process: the Blender scene and the VFS are
          # process-global. --cov rather than `coverage run`, which would
          # measure the controller process only.
          cov=()
          if [ "${{ matrix.bpy.coverage }}" == "true" ]; then
            export COVERAGE_FILE=.coverage.${{ matrix.bpy.bpy-version }}
            cov=(--cov --cov-report=)
          fi
          pytest -n 4 --dist loadfile "${cov[@]}" --game-dir=re5::r2://"$R2_BUCKET_NAME"/re5 --game-dir=re1::r2://"$R2_BUCKET_NAME"/re1 --game-dir=umvc3::r2://"$R2_BUCKET_NAME"/umvc3 --game-dir=re4uhd::r2://"$R2_BUCKET_NAME"/re4uhd --game-dir=reorc::r2://"$R2_BUCKET_NAME"/reorc
        exitcode="$?"
        # bpy segfaults during interpreter finalization, so a 139 here says
        # nothing about whether the run passed - it is what this job sees on
        # every run, failing or not. Fall back to the status pytest recorded
        # itself before that happened (tests/conftest.py). Discounting 139
        # outright, which this used to do, reported 8 errors as a green build.
        # No file means pytest died before finishing: keep 139 as a failure.
        if [ "$exitcode" == 139 ]; then
          exitcode="$(cat "$ALBAM_PYTEST_EXIT_STATUS_FILE" 2>/dev/null || echo 139)"
        fi
        exit "$exitcode"
    - name: "Upload test results"
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: junit-${{ matrix.bpy.bpy-version }}
        path: junit-${{ matrix.bpy.bpy-version }}.xml
        if-no-files-found: error
    - name: "Upload coverage data"
      if: matrix.bpy.coverage
      uses: actions/upload-artifact@v7
      with:
        name: .coverage.${{ matrix.bpy.bpy-version }}
        path: .coverage.${{ matrix.bpy.bpy-version }}
        include-hidden-files: true
        if-no-files-found: error
    - name: Build and smoke-test the extension zip
      # What gets published is the zip, not this checkout: it carries its
      # dependencies as bundled wheels, and a dependency missing from
      # pylock.toml breaks every install while leaving CI green. So install
      # the zip into a Blender that has none of albam's dependencies -
      # reusing this job's venv would import them from there and pass on a
      # zip missing every wheel. The second venv is hardlinked out of the uv
      # cache the install step above already filled, so it costs seconds.
      run: |
        "$pythonLocation/bin/python" -m pip install --quiet packaging
        "$pythonLocation/bin/python" scripts/build_extension.py --output-dir dist
        uv venv --python "${{ matrix.bpy.python-version }}" "$RUNNER_TEMP/venv-smoke"
        uv pip install --python "$RUNNER_TEMP/venv-smoke/bin/python" \
          "bpy==${{ matrix.bpy.bpy-version }}" --extra-index-url https://download.blender.org/pypi/
        "$RUNNER_TEMP/venv-smoke/bin/python" scripts/smoke_test_extension.py dist/albam-*.zip
  coverage:
    # thanks: https://nedbatchelder.com/blog/202209/making_a_coverage_badge.html
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v5"
      - name: "Set up Python"
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"
          # No pip cache here: this job installs one small package, and the
          # key it used pointed at requirements/*.txt, which does not exist.
      - name: "Install dependencies"
        run: |
          python -m pip install coverage
      - name: "Download coverage data"
        uses: actions/download-artifact@v8
        with:
          path: .covdata
          pattern: .coverage.*
          merge-multiple: true
      - name: "Combine"
        run: |
          coverage combine .covdata/
          coverage json -o .coverage.json
          export TOTAL=$(python -c "import json;print(json.load(open('.coverage.json'))['totals']['percent_covered_display'])")
          echo "total=$TOTAL" >> $GITHUB_ENV
          echo "### Total coverage: ${TOTAL}%" >> $GITHUB_STEP_SUMMARY
      - name: "Coverage report"
        run: coverage report --sort cover
      - name: "Make badge"
        # The badge is public and reads as "albam's coverage", so only main
        # may write it - the steps above still run everywhere, so a PR (or a
        # workflow_dispatch run on a branch) keeps its coverage report and
        # step summary. Without this the job had no branch condition at all,
        # and a branch run would overwrite the badge with that branch's number.
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          # GIST_TOKEN is a GitHub personal access token with scope "gist".
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 879e4f106f38b080ff10d3f46e3336e6
          filename: covbadge.json
          label: Coverage
          message: ${{ env.total }}%
          minColorRange: 50
          maxColorRange: 90
          valColorRange: ${{ env.total }}
