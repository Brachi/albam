[project]
name = "Albam"
version = "0.5.0"
description = "Import and Export game engine formats in Blender"
readme = "README.md"
authors = [ {name = "Sebastian Aguirre Brachi"}, {name = "Henry of Carim"} ]
requires-python = ">=3.11, <3.14"
license = {file = "LICENSE"}
keywords = ["modding", "game-modding", "blender-addon", "import", "export"]

dependencies = [
  'bpy == 4.2.0; python_version == "3.11.*"',
  'bpy == 5.2.0; python_version == "3.13.*"',
]

[project.optional-dependencies]

tests = [
  "pytest",
  "pytest-subtests",
  "coverage[toml]",
  "flake8-pyproject",
  "moto[s3]>=5.0.0",
  "python-dotenv",
]

# albam.engines.mtfw.arc_fs: PyFilesystem2-based virtual filesystem over
# MTFramework .arc archives (+ loose files), local or S3/R2-backed.
s3 = [
  "fs",
  "boto3",
  "smart-open[s3]>=7.0.0",
]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 110

[tool.coverage.run]
omit = [ "*/albam_vendor/*" ]

[tool.flake8]
max-line-length = 110
exclude = ["albam_vendor", ".venv", "structs"]

# F722: needed for Blender props annotations such as
# ```
# class MyPanel(bpy.types.Panel):
#     my_prop : bpy.props.BoolProperty()
# ```
# W503 and W504 seem to contradict each other
ignore = ["E203", "F722", "W504"]
